services:
  - type: web
    name: datify-backend
    env: node
    buildCommand: pnpm build
    startCommand: node dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: datify-db
          properties: connectionString
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: ADMIN_EMAIL
        value: ${ADMIN_EMAIL}
      - key: ADMIN_PASSWORD
        value: ${ADMIN_PASSWORD}
    plan: starter
    autoDeploy: true
